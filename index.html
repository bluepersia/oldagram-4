<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oldagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/css/index.css" />
    <link rel="stylesheet" href="./src/css/utilities.css" />

    <link rel="stylesheet" href="./src/css/blocks/header.css" />
    <link rel="stylesheet" href="./src/css/blocks/post-card/post-card.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__inner container">
        <h1 class="sr-only">Oldagram</h1>
        <a class="header__logo-link" aria-label="Go to home" href="#"
          ><img class="header__logo-img" src="./images/logo.png" alt=""
        /></a>
        <img
          class="header__avatar"
          src="./images/user-avatar.png"
          alt="Per Borgen smiling at the camera"
        />
      </div>
    </header>

    <main>
      <section class="main-feed">
        <h2 class="sr-only">Main Feed</h2>
        <ul class="main-feed__list" id="main-feed-list">
          <li class="main-feed__item">
            <article class="post-card">
              <header class="post-card__header container">
                <img
                  class="post-card__avatar"
                  src="./images/avatar-vangogh.jpg"
                  alt="Van Gogh avatar"
                />
                <div class="post-card__header-info">
                  <h3 class="post-card__name">Vincent van Gogh</h3>
                  <p class="post-card__location">Zudert, Netherlands</p>
                </div>
              </header>

              <img
                class="post-card__main-img"
                src="./images/post-vangogh.jpg"
                alt="Portrait of Van Gogh"
                data-img
              />

              <div class="post-card__content container">
                <div class="post-card__actions">
                  <button class="post-card__action" aria-label="Like" data-like>
                    <img
                      class="post-card__action-img"
                      src="./images/icon-heart.png"
                      alt=""
                    />
                  </button>
                  <button class="post-card__action" aria-label="Comment">
                    <img
                      class="post-card__action-img"
                      src="./images/icon-comment.png"
                      alt=""
                    />
                  </button>
                  <button class="post-card__action" aria-label="Direct message">
                    <img
                      class="post-card__action-img"
                      src="./images/icon-dm.png"
                      alt=""
                    />
                  </button>
                </div>
                <p class="post-card__likes" data-likes>21,492 likes</p>
                <p class="post-card__text">
                  <span class="post-card__text-user">vincey1853</span>just took
                  a few mushrooms lol
                </p>
              </div>
            </article>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
