<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Oldagram</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./src/css/index.css" />
    <link rel="stylesheet" href="./src/css/utilities.css" />

    <link rel="stylesheet" href="./src/css/blocks/header.css" />
    <link rel="stylesheet" href="./src/css/blocks/post-card/post-card.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__inner container">
        <h1 class="sr-only">Oldagram</h1>
        <a class="header__logo-link" aria-label="Go to home" href="#"
          ><img class="header__logo-img" src="./images/logo.png" alt=""
        /></a>
        <img
          class="header__avatar"
          src="./images/user-avatar.png"
          alt="Per Borgen smiling at the camera"
        />
      </div>
    </header>

    <main>
      <section class="main-feed">
        <h2 class="sr-only">Main Feed</h2>
        <ul class="main-feed__list" id="main-feed-list"></ul>
      </section>
    </main>

    <script src="./src/js/index.js" type="module"></script>
  </body>
</html>
